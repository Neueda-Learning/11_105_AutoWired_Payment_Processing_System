server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container. The hostname
    # "server" matches the service name used in docker-compose.yml.
    # X-Forwarded-Host/Port let Spring (server.forward-headers-strategy=framework)
    # know the real externally-visible host:port, so springdoc-openapi generates
    # the correct "servers" URL in /v3/api-docs instead of the internal 8080.
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Proxy springdoc-openapi's Swagger UI + API docs through the same
    # externally-published port, since the server container has no port
    # of its own exposed to the host anymore.
    location /swagger-ui/ {
        proxy_pass http://server:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v3/api-docs {
        proxy_pass http://server:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /webjars/ {
        proxy_pass http://server:8080/webjars/;
        proxy_set_header Host $host;
    }

    # SPA client-side routing (react-router) - fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
